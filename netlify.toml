[build]
  # Build both the API (outputs netlify/functions/api.mjs) and the frontend
  base    = ""
  command = "pnpm install && pnpm --filter @workspace/api-server run build && pnpm --filter @workspace/flight-timetable run build"
  publish = "artifacts/flight-timetable/dist/public"

[build.environment]
  NODE_VERSION = "22"

[functions]
  # Netlify will pick up netlify/functions/api.mjs automatically
  directory = "netlify/functions"
  node_bundler = "none"

# Route all API calls to the serverless function
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/api"
  status = 200
  force  = true

# SPA fallback — all other paths serve index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
